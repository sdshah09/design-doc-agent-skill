name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.0.0)
        required: true

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test

      # The tag is the source of truth for the version; package.json is stamped from it.
      - run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # Cut the release first so a missing or expired npm token can be fixed and the publish
      # re-run via workflow_dispatch, without losing the release.
      - run: gh release create "$TAG" --generate-notes --verify-tag || echo "release already exists"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set — skipping npm publish. Add the secret and re-run this workflow."
            exit 0
          fi
          npm publish
